; -------------------------------------------------------------------
;  Robot DIAN - configuracion
;  Editalo con el Bloc de notas y guarda. Es lo unico que hay que tocar.
; -------------------------------------------------------------------

[dian]
; Clave tecnica de tu software, tal cual aparece en el portal de la DIAN.
; Sin ella el CUFE NO se puede calcular (entra dentro del hash).
clave_tecnica = PEGA_AQUI_TU_CLAVE_TECNICA

; 1 = produccion    2 = habilitacion / pruebas
; Solo se usa de respaldo: si el XML trae ProfileExecutionID, MANDA el del XML,
; porque ese es el que valida la DIAN. Si no coinciden el robot te avisa.
ambiente = 1


[carpetas]
; Solo se usan en el modo vigilar (2_VIGILAR_CARPETA.bat).
; Pueden ser rutas completas, por ejemplo:  entrada = C:\FacturasERP\salida
entrada = entrada
salida = salida
procesados = procesados
errores = errores

; Cada cuantos segundos revisa la carpeta de entrada.
intervalo_segundos = 5

; Como se llama el XML corregido que sale en la carpeta "salida".
;   igual  = con el MISMO nombre del original  (recomendado: asi tu .bat de
;            firma y envio lo encuentra sin cambiarle nada)
;   sufijo = le agrega _corregido al nombre
nombre_salida = igual
